## This file contains files and directories that should
## be preserved during an upgrade.

# /etc/example.conf
# /etc/openvpn/

# qosmate is a third-party LuCI app (github.com/hudra0/qosmate) installed
# outside the package manager, so nothing in the image replaces it. The
# original four lines here kept only the backend; the web UI, the rpcd
# backends and qosmate-autorate all live outside /etc and were being lost on
# every flash.
/etc/qosmate.sh
/etc/init.d/qosmate
/etc/qosmate.d
/etc/qosmate-autorate.sh
/etc/qosmate-autorate-tc.sh
/etc/init.d/qosmate-autorate
/usr/libexec/rpcd/luci.qosmate
/usr/libexec/rpcd/luci.qosmate_stats
/usr/share/luci/menu.d/luci-app-qosmate.json
/usr/share/rpcd/acl.d/luci-app-qosmate.json
/www/luci-static/resources/view/qosmate

# AdGuardHome persistent state on the overlay.
#
# Deliberately NOT /opt/adguardhome wholesale. data/querylog.json and
# data/querylog.json.1 are ~200 MB of live rotating log; sysupgrade stages the
# keep list in /tmp, which is tmpfs = RAM, and this router has 1 GB with no
# swap. Tarring 200 MB of transient log into RAM while flashing is how you
# lose an upgrade. agh-archive.sh already snapshots querylog.json.1 into
# archive/, so the history survives there in gzipped form (~14 MB).
#
# Everything listed below totals ~23 MB.
/opt/adguardhome/archive
/opt/adguardhome/data/filters
/opt/adguardhome/data/stats.db
/opt/adguardhome/data/sessions.db

# CrowdSec firewall bouncer support scripts.
#
# The bouncer package itself is reinstalled by the image and its UCI config
# (/etc/config/crowdsec) is a package conffile, so both survive on their own.
# These two are hand-written and live outside any package, so without listing
# them here a sysupgrade silently drops them and the bouncer goes back to
# failing open after the next LAPI restart.
#
# watchdog: restarts the bouncer when its nftables sets are empty. See the
# comment block in the script for the failure it exists to catch.
# hotplug hook: restarts the bouncer after interface-driven firewall reloads.
/usr/bin/crowdsec-watchdog.sh
/etc/hotplug.d/firewall/99-crowdsec-bouncer

# WAN malformed-packet drops, added when banIP was retired. Hand-written,
# outside any package, so sysupgrade would otherwise drop it silently.
/etc/nftables.d/20-flood-limits.nft
/etc/hotplug.d/iface/13-qosmateHotplug
/usr/bin/qosmate-ipv6-sync

# Tailscale node identity. The packaged init keeps state under /etc/tailscale
# (persistent), not the old /var/lib/tailscale which lives on tmpfs. /etc/config/
# is kept automatically; this path is not, so list it explicitly.
/etc/tailscale/
